<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Our Page</title>

    <link rel="stylesheet" href="mine.css">
</head>

<body>

    <div class="page">

        <!-- Left Side - Couple Image -->
        <div class="image-section">

            <div class="heart heart-one">♡</div>
            <div class="heart heart-two">♡</div>
            <div class="heart heart-three">♡</div>

            <div class="image-frame">
                <img src="couple.jpg" alt="Our Cute Moment">
            </div>

            <p class="image-text">A little place made just for us ♡</p>

        </div>


        <!-- Right Side - Password -->
        <div class="login-section">

            <div class="content">

                <p class="small-title">WELCOME TO</p>

                <h1>It's Our Page</h1>

                <div class="yellow-line"></div>

                <p class="message">
                    A little secret place<br>
                    made only for us.
                </p>

                <label for="password">Enter the password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        maxlength="4"
                    >

                    <button id="enterBtn">♡</button>

                </div>

                <p class="hint">
                    Our Date of Birth — the last 2 digits of the year
                </p>

                <p id="errorMessage"></p>

            </div>

        </div>

    </div>


    <script src="mine.js"></script>

</body>
</html>
