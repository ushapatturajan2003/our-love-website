
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me?</title>

    <link rel="stylesheet" href="mine.css">
</head>

<body>

    <div class="love-page">

        <!-- Floating Hearts -->
        <div class="floating-heart heart-1">♡</div>
        <div class="floating-heart heart-2">♥</div>
        <div class="floating-heart heart-3">♡</div>
        <div class="floating-heart heart-4">♥</div>
        <div class="floating-heart heart-5">♡</div>
        <div class="floating-heart heart-6">♥</div>


        <div class="question-card">

            <div class="big-heart">
                ♥
            </div>

            <p class="little-text">
                Just one little question...
            </p>

            <h1>
                Do You Love Me?
            </h1>

            <p class="cute-message">
                Think carefully before you answer ♡
            </p>


            <div class="answer-area">

                <!-- NO - LEFT -->
                <button id="noButton" class="answer-button no-button">
                    No
                </button>


                <!-- YES - RIGHT -->
                <button id="yesButton" class="answer-button yes-button">
                    Yes ♡
                </button>

            </div>

        </div>

    </div>


    <script src="mine.js"></script>

</body>
</html>
