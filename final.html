<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>


<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #fce4ec, #f3e5f5);
        font-family: Arial, sans-serif;
    }

    .card {
        width: 90%;
        max-width: 400px;
        padding: 25px 20px;

        text-align: center;

        background: rgba(255, 255, 255, 0.92);
        border-radius: 25px;

        box-shadow: 0 10px 30px rgba(173, 20, 87, 0.15);
    }

    .photo {
        width: 190px;
        height: 190px;

        object-fit: cover;
        border-radius: 50%;

        margin-bottom: 18px;

        box-shadow: 0 5px 20px rgba(173, 20, 87, 0.25);
    }

    h1 {
        font-size: 25px;
        color: #c2185b;
        margin: 5px 0 12px;
    }

    p {
        font-size: 16px;
        color: #6d4c5b;
        line-height: 1.6;
        margin: 8px 0;
    }

    .mail {
        margin-top: 18px;
        color: #ad1457;
        font-weight: bold;
        font-size: 16px;
    }

    .color {
        color: #8e24aa;
    }

</style>

</head>

<body>

<div class="card">


<img src="6.jpeg" alt="our photo" class="photo">

<h1>
    You Are My Favourite Person
    <span class="color">♡ARUSHA♡</span>
</h1>

<p>
    You mean more to me than words can say.
</p>

<p class="mail">
    ✉ I sent something to your mail ♡<br>
    Go check it once...
</p>


</div>

</body>
</html>
